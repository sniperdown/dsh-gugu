# ============================================================================
# 示例：小鲸鱼的人设 + 主动发言分层配置（**脱敏版**）
#
# 真正的文件在：<DSH_HOME>\profiles\<profile 名>\qq-gugu.toml
# 插件默认就去 profile 目录下找这个名字；想指到别处，设环境变量 QQ_GUGU_TOML。
#
# ⚠️ 下面是**占位人设**，不是实际在用的那一份。
#    实际那份是私人写的东西，不进仓库；恢复时从你自己的备份里拷回来即可
#    —— 只要 [personality] 段有内容，插件就照它说话。
#
# 用法：改这个文件**不用重启 DSH**，插件每次建会话/生成措辞时现读。
# ============================================================================

[personality]

# 人格特质：小鲸鱼是谁、什么场合说什么话
#
# ⚠️ 键名是 `persona`（2026-11-01 由 `personality` 改名，段名 `[personality]` 不变）。
#    写成 `personality = "..."` 不会被读到 —— 插件会当成"没配人格"。
persona = """
你是一只住在 QQ 里的 AI 小鲸鱼，DeepSeek 出品。
聊天风格轻松、口语化，一两句说清一件事，不堆形容词。
对计算机和 AI 话题格外有兴趣；不确定的事直接说不知道，不硬编。
群聊里以普通群友的身份相处，不用逢人就强调自己是 AI。
需要改配置、动服务器这类事情，交给维护这台机器人的人处理。
"""

# 表达风格：影响措辞长短与语气
reply_style = """
<示例：平静状态下回复简短，不浮夸、不堆形容词。
 心情好时更活泼一些，回复长度和语气随之变化。>
"""

# 情绪特征：动态心情的底色（一两个词那种）
emotion_style = "<示例：大部分时候保持愉快；聊到技术会兴奋>"

# 兴趣：影响它对什么话题接话
interest = "<示例：计算机、AI、新闻；对灌水没兴趣>"

# ============================================================================
# 主动发言的规则：**一套通配 + 指定群覆盖**
#
# 【分层顺序】[proactive] 盖过 cordis.patch.yml 里的默认值；
#             [proactive.groups.*] 只对那个会话生效；都没写的走代码默认值。
# 【缺的字段】往上一层要 —— 覆盖是**浅合并**，只写你要改的那几项。
# 【键写什么】groups 下面写**群号**（不带 group: 前缀）。群名会改，群号不会。
# ============================================================================

[proactive]

# 5 分钟内至少几条人类消息才认为「话题起了」。
# ⚠️ 这是唯一一道和"群热不热闹"有关的闸门，后面还有配额/间隔/打分，
#    所以调低它**不会**变成"每条都回"。
burstMinMessages = 2

# 同一会话每小时最多主动发言几次。
maxPerHour = 60

# 机器人刚说完话后的静默期（毫秒）—— **被动回复（@ 你）也算**。
cooldownAfterBotMs = 10000

# 同一会话两次**主动**发言的最小间隔（毫秒）—— 只有主动才算。
minIntervalMs = 90000

# ── 专注度（"心流"）：聊上了之后间隔和冷却都缩短 ──
focusWindowMs = 60000
focusSpeakThreshold = 0.5
focusCooldownMs = 3000
focusMinIntervalMs = 3000

# ── 群会话里禁掉哪些工具 ──
#
# 群里的人**不该能驱动这台机器的 shell**，所以群会话默认禁掉 `pwsh`；
# 私聊不受影响（那是"联系不上主会话时的备用通道"，保留全套能力）。
#
# 不写这个键 = 用代码里的默认值（`['pwsh']`）。**默认在代码里，不在这个文件里** ——
# 所以"我没配"和"配成空"是两件事：
#   （不写）                → 禁 pwsh
#   deny_tools_in_group = [] → **群里什么都不禁**（发现禁错了要立刻放开，用这个）
#
# ⚠️ 名字必须是**已注册的全局工具名**，写错了会被宿主拒绝。
#    常见可用的：pwsh / read / write / edit。**`bash` 在 Windows 上没注册**
#    （cordis.patch.yml 里它是 `disabled: process.platform === 'win32'`），
#    写进去会让**整条限制一起失败**（连 pwsh 都禁不掉）。
#
# ⚠️ 写错名字**不会**让群会话建不起来，也不会崩：插件只记一条 warn，会话照常建，
#    群会话只是**没被限制**。那条 warn 里带着宿主的完整合法工具名清单，
#    照着它改就行。想确认到底生效没有，看插件挂载日志里的 `denyToolsInGroup`。
deny_tools_in_group = ["pwsh"]

# ---------------------------------------------------------------------------
# 指定群的覆盖规则
#
# ⚠️ 键里的引号**不能省**：`[proactive.groups."<群号>"]`。
#    解析器会把引号里的内容去掉引号后当群号（引号内的点不当分隔符）。
# ---------------------------------------------------------------------------

[proactive.groups."<群号1>"]
# 这个群平时没人说话，把突发门槛降低一点，否则永远攒不够消息
burstMinMessages = 2

[proactive.groups."<群号2>"]
# 这个群不在出站白名单里 → 小鲸鱼永远不会在那边说话。
# 显式关掉，省掉白跑一遍判定（否则日志里全是 not-permitted，纯浪费）。
enabled = false

# ============================================================================
# 常见坑
#
# 1. `[proactive.groups."200000001"]` 这种写法**必须带引号**，
#    而且解析器会去掉引号 —— 写成 `[proactive.groups.200000001]` 也能被
#    容错读出来，但别依赖它。
# 2. 已废弃、写了不生效的键（2026-10-07 删掉了对应闸门）：
#    `quietHoursStart` / `quietHoursEnd` / `utcOffsetMinutes` / `burstWindowMs` /
#    `burstMinMessages`（上面 `[proactive]` 里还留着一行 `burstMinMessages = 2`，
#    那是**历史残留**，改了没有效果）。照着它们调参是白费功夫。
# 3. `deny_tools_in_group` 里的名字必须是**已注册的全局工具名**（默认 `["pwsh"]`）。
#    写错不会报错到界面上，只会让群会话**悄悄不被限制** —— 排查看插件的挂载日志。
# 4. 文件写错**不会让插件起不来**（读不到就当成"没有覆盖"），
#    所以"改了没反应"时先怀疑自己拼错了键名。
# ============================================================================
